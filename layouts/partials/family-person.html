{{ $p := index .site.Data.familia.people .id }}
<a class="person {{ if $p.image }}person-photo{{ end }}" href="#p-{{ .id }}" data-person="{{ .id }}">
  {{ with $p.image }}<span class="person-thumbnail {{ $p.imageClass }}"><img src="/familia/img/{{ . }}" width="{{ $p.imageWidth | default 265 }}" height="{{ $p.imageHeight | default 373 }}" alt="" loading="lazy"></span>{{ end }}
  <span><strong>{{ $p.short }}</strong><small>{{ if $p.era }}{{ $p.era }}{{ else }}{{ $p.relation }}{{ end }}</small></span><span class="person-arrow" aria-hidden="true">↗</span>
</a>
